services:
  # ai-coo Services
  aicoo-postgres:
    image: postgres:16-alpine
    container_name: aicoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicoo
    ports:
      - '5432:5432'
    volumes:
      - aicoo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  aicoo-redis:
    image: redis:7-alpine
    container_name: aicoo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - aicoo-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

