apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ticket-booking-api
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # Scale up to 100 containers during flash sales, scale to 0 when idle
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '100'
        # Since Node.js event loop handles concurrency well, allow 250 concurrent requests per container
        run.googleapis.com/container-concurrency: '250'
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/ticket-booking-api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1000m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloudsql-db-host
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: memorystore-redis-url
                  key: latest
